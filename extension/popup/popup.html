<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>HTB Reader</title>
    <link rel="stylesheet" href="../lib/ui.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="../icons/icon.svg" alt="" width="22" height="22" />
      <h1>HTB Reader</h1>
      <span id="server-dot" class="dot" title="Voice server status"></span>
    </header>

    <p id="server-msg" class="server-msg" hidden></p>

    <section class="now">
      <div id="title" class="title">Nothing playing</div>
      <div id="status" class="muted">Open an HTB Academy section and press play.</div>
      <div id="text" class="text"></div>
    </section>

    <div class="controls">
      <button id="prev" class="icon-btn round" title="Previous paragraph">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z" /></svg>
      </button>
      <button id="play" class="icon-btn round big primary" title="Play / pause">
        <svg id="play-icon" viewBox="0 0 24 24" width="26" height="26"><path d="M8 5v14l11-7z" /></svg>
      </button>
      <button id="next" class="icon-btn round" title="Next paragraph">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M6 18l8.5-6L6 6v12zM16 6h2v12h-2z" /></svg>
      </button>
      <button id="stop" class="icon-btn round" title="Stop">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M7 7h10v10H7z" /></svg>
      </button>
    </div>

    <div class="row">
      <label for="speed">Speed</label>
      <input id="speed" type="range" min="0.5" max="2.5" step="0.1" />
      <span id="speed-value" class="value">1.0×</span>
    </div>
    <div class="row">
      <label for="voice">Voice</label>
      <select id="voice"></select>
    </div>

    <footer>
      <span id="progress" class="muted"></span>
      <button id="options">Settings</button>
    </footer>

    <script src="../lib/settings.js"></script>
    <script src="popup.js"></script>
  </body>
</html>

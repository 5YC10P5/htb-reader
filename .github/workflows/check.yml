name: Check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate the Firefox extension
        run: npm run lint -- --warnings-as-errors
      - name: Page reading test
        run: npm test
      - name: Syntax check
        run: |
          for f in extension/*.js extension/*/*.js server/*.mjs tests/*.mjs; do node --check "$f"; done
